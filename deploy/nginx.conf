# Install on a Node-capable VPS after provisioning the domain's TLS certificate.
# The application repository and private store must never be an nginx docroot.
server {
    listen 80;
    server_name aumestates.com www.aumestates.com;
    return 301 https://aumestates.com$request_uri;
}

server {
    listen 443 ssl;
    server_name aumestates.com www.aumestates.com;
    ssl_certificate /etc/letsencrypt/live/aumestates.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aumestates.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
    client_max_body_size 14m;

    # Includes /api, /crm and /shortlist. All browser requests stay same-origin.
    # Inventory gets no-cache from Node, so fresh prices are not cached for days.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }
}
